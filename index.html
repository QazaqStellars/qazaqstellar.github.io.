<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qazaqstellar — Agricultural risk analysis for Kazakhstan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --navy:#08131F;--navy2:#0D1E2E;--navy3:#132A3E;--line-d:#1F3A52;--ink-d:#E6EEF5;--muted-d:#8FA6BA;
  --bg:#EEF2F5;--card:#fff;--ink:#14212D;--muted:#5A6B7A;--line:#DCE3EA;--accent:#1F8A5B;--accent2:#2DB37A;--blue:#3B82C4;
  --low:#3FAE6A;--mod:#E3C443;--high:#E8873A;--vhigh:#D9483B;--demo:#8A5CF6;
  --r:12px;--sh:0 1px 2px rgba(10,30,50,.06),0 4px 16px rgba(10,30,50,.06);
  --f-h:"Space Grotesk",system-ui,sans-serif;--f-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--f-b);color:var(--ink);background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* ---- sidebar ---- */
.side{background:linear-gradient(180deg,#08131F 0%,#0A1C24 60%,#0B2420 100%);color:var(--ink-d);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line-d)}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 10px}
.brand b{font:700 19px/1 var(--f-h);letter-spacing:.2px}
.brand small{display:block;color:var(--muted-d);font-size:11px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--muted-d);text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:#ffffff0d;color:var(--ink-d)}
.nav a.on{background:linear-gradient(90deg,#1F8A5B33,#1F8A5B10);color:#fff;box-shadow:inset 3px 0 0 var(--accent2)}
.nav svg{width:16px;height:16px;flex:none;opacity:.85}
.nav .num{font:500 10px var(--f-m);color:#5f7a90;width:14px}
.datacard{margin-top:auto;background:#ffffff08;border:1px solid var(--line-d);border-radius:10px;padding:12px;font-size:12.5px}
.datacard h4{margin:0 0 6px;font:600 12px var(--f-h);letter-spacing:.6px;text-transform:uppercase;color:var(--muted-d)}
.datacard .mode{font-weight:600;margin-bottom:8px}
.datacard button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:var(--accent);color:#fff;padding:7px 11px;border-radius:7px;font-weight:600;cursor:pointer;font-size:12.5px;transition:filter .15s,transform .05s}
.btn:hover,.datacard button:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.datacard button.ghost{background:transparent;border-color:var(--line-d);color:var(--ink-d)}
.datacard .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.datacard .msg{color:var(--muted-d);margin-top:8px;font-size:11.5px}
/* ---- main ---- */
.main{background:var(--bg);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 22px;flex-wrap:wrap}
.top h1{font:600 17px var(--f-h);margin:0;display:flex;gap:8px;align-items:center}
.top .sp{flex:1}
.search{position:relative}
.search input{width:240px;border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 32px;background:#fff}
.search svg{position:absolute;left:10px;top:50%;margin-top:-7px;width:14px;height:14px;color:var(--muted)}
.search ul{position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);list-style:none;margin:0;padding:4px;max-height:300px;overflow:auto;display:none;z-index:30}
.search ul.open{display:block}
.search li{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.search li:hover,.search li.act{background:#EEF6F1}
.search li small{color:var(--muted)}
select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#EEF2F5;color:var(--muted);white-space:nowrap}
.chip.demo{background:#F1EBFF;color:#6236D9}
.chip.nasa{background:#E3F1FF;color:#1C5E9E}
.chip.derived{background:#E6F5EE;color:#196B47}
.chip.unav{background:#F3F3F3;color:#777}
.chip.pilot{background:#FFF4D6;color:#8A5B00}
.chip.lvl{color:#fff}
.banner{margin:14px 22px 0;padding:10px 14px;border-radius:10px;background:#F4EFFF;border:1px solid #DCCFFF;color:#45238F;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:#E8F4FD;border-color:#BFDDF5;color:#173F63}
.banner b{font-weight:600}
.view{padding:18px 22px 60px;display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.hero{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card.dark{background:var(--navy2);border-color:var(--line-d);color:var(--ink-d)}
.card h2{font:600 15px var(--f-h);margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font:600 13.5px var(--f-h);margin:14px 0 6px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.card.dark .sub{color:var(--muted-d)}
.sec-h{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sec-h h2{font:700 22px var(--f-h);margin:0}
.sec-h p{margin:0;color:var(--muted);flex-basis:100%}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:600 22px var(--f-h)}
.kpi span{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpis .kpi{background:#F6F8FA;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.mono{font-family:var(--f-m);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
/* ---- map ---- */
.mapwrap{position:relative;background:radial-gradient(ellipse at 40% 30%,#14304A 0%,#0B1A29 70%);border-radius:10px;overflow:hidden;border:1px solid var(--line-d)}
.mapwrap svg{display:block;width:100%;height:auto;cursor:grab}
.mapwrap .rg{stroke:#0B1A29;stroke-width:.8;transition:opacity .2s,filter .15s;cursor:pointer}
.mapwrap .rg:hover,.mapwrap .rg.hov{filter:brightness(1.18);stroke:#fff;stroke-width:1.4}
.mapwrap .rg.sel{stroke:#fff;stroke-width:2.2}
.mapwrap .rg.dim{opacity:.22}
.mapwrap .pilot-ring{fill:none;stroke:#FFD166;stroke-width:2;stroke-dasharray:6 4;animation:dash 1.6s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-20}}
.mapwrap .lbl{fill:#E6EEF5;font:600 9.5px var(--f-b);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0B1A29;stroke-width:2.5px}
.mapwrap .grat{fill:none;stroke:#ffffff10}
.maptip{position:absolute;pointer-events:none;background:#0B1A29f2;color:#fff;border:1px solid #2C4C68;border-radius:8px;padding:7px 9px;font-size:12px;display:none;max-width:240px;z-index:5}
.maptip b{display:block;font-family:var(--f-h)}
.maptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.maptools label{font-size:12px;color:var(--muted-d);display:flex;gap:6px;align-items:center}
.card:not(.dark) .maptools label{color:var(--muted)}
.maptools select{background:#132A3E;color:var(--ink-d);border-color:var(--line-d)}
.card:not(.dark) .maptools select{background:#fff;color:var(--ink);border-color:var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted-d);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.legend .grad{width:140px;height:10px;border-radius:5px;display:inline-block;vertical-align:middle;margin:0 6px}
.mapmsg{position:absolute;left:10px;bottom:10px;right:10px;background:#0B1A29e8;border:1px solid #2C4C68;color:#C9D8E5;font-size:11.5px;border-radius:8px;padding:7px 10px}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:28px;height:28px;border-radius:6px;border:1px solid #2C4C68;background:#0B1A29d0;color:#fff;cursor:pointer;font-weight:700}
/* ---- risk ---- */
.risk{border-left:4px solid var(--line)}
.risk .top-r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.risk ul{margin:6px 0 0;padding-left:18px}
.risk li{margin:2px 0}
.bar-s{height:7px;border-radius:4px;background:#EDF1F4;overflow:hidden;margin:8px 0 4px}
.bar-s i{display:block;height:100%;border-radius:4px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:500}
.gauge{display:flex;gap:16px;align-items:center}.gauge svg{flex:none}
/* ---- crops ---- */
.crop .ttl{display:flex;justify-content:space-between;gap:8px;align-items:center}
.crop dl{grid-template-columns:120px 1fr;font-size:12.5px}
.crop ul{margin:4px 0;padding-left:18px;font-size:12.5px}
/* ---- rotation ---- */
.weights{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.weights label{display:flex;flex-direction:column;gap:4px;font-size:12px}
.weights b{font-family:var(--f-m);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.cropchip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:600;color:#fff}
.arrow{color:var(--muted)}
.score-big{font:700 30px var(--f-h)}
.scen{border-top:4px solid var(--accent)}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px}
.pc ul{margin:4px 0;padding-left:16px}
.pc .p li::marker{color:var(--accent)}
.pc .c li::marker{color:var(--high)}
.builder{display:flex;flex-wrap:wrap;gap:6px}
.builder button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px}
.builder button:hover{border-color:var(--accent)}
.formula{background:#F6F8FA;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-m);font-size:11.5px;white-space:pre-wrap;overflow:auto}
/* ---- ai ---- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto;padding:4px}
.msg-u{align-self:flex-end;background:#1F8A5B;color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:80%}
.msg-a{align-self:flex-start;background:#F6F8FA;border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:10px 14px;max-width:92%}
.msg-a p{margin:0 0 8px}.msg-a ul{margin:0 0 8px;padding-left:18px}
.msg-a .meta{font-size:11px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.prompts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.prompts button:hover{border-color:var(--accent);color:var(--accent)}
.askrow{display:flex;gap:8px;margin-top:10px}
.askrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.ai-insight{background:linear-gradient(135deg,#0D1E2E,#0E2A26);color:#E6EEF5;border:none}
.ai-insight .sub{color:#9FB6C8}
.ai-insight p{margin:0 0 8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 #2DB37A88;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px #2DB37A00}100%{box-shadow:0 0 0 0 #2DB37A00}}
/* ---- charts ---- */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .ax text{fill:var(--muted);font:10.5px var(--f-b)}
.chart .ax path,.chart .ax line{stroke:#C9D3DC}
.chart .gl line{stroke:#EDF1F4}
.chart .gl path{display:none}
.ctip{position:absolute;pointer-events:none;background:#0B1A29f0;color:#fff;border-radius:7px;padding:6px 8px;font-size:11.5px;display:none;white-space:nowrap;z-index:4}
.srcline{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{display:flex;align-items:center;justify-content:center;min-height:150px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;padding:16px;font-size:12.5px;background:repeating-linear-gradient(45deg,#fafbfc,#fafbfc 8px,#f3f5f7 8px,#f3f5f7 16px)}
/* ---- forms ---- */
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{color:var(--ink)}
.periodsel{display:flex;gap:6px;align-items:center;font-size:12.5px}
.hide{display:none!important}
.toast{position:fixed;bottom:18px;right:18px;background:#0B1A29;color:#fff;padding:10px 14px;border-radius:9px;box-shadow:var(--sh);font-size:13px;z-index:60;max-width:380px;display:none}
.menu-btn{display:none}
@media (max-width:1100px){.hero,.g2{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}.weights{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .g3,.g4,.form,.pc{grid-template-columns:1fr}.weights{grid-template-columns:1fr 1fr}
  .search input{width:170px}.top{padding:10px 12px}.view{padding:14px 12px 50px}.banner{margin:12px 12px 0}
  .dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2DB37A"/><stop offset="1" stop-color="#3B82C4"/></linearGradient></defs><circle cx="20" cy="20" r="11" fill="url(#lg)"/><ellipse cx="20" cy="20" rx="18" ry="6.5" fill="none" stroke="#FFD166" stroke-width="1.6" transform="rotate(-22 20 20)"/><path d="M20 12c-3 3-3 13 0 16M13 18h14M14 23h12" stroke="#08131F" stroke-width="1.4" fill="none" opacity=".55"/><circle cx="35" cy="13" r="2" fill="#FFD166"/></svg>
    <div><b>Qazaqstellar</b><small>Agricultural risk · NASA EO</small></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="datacard">
    <h4>Data source</h4>
    <div class="mode" id="dmode">NASA POWER</div>
    <div class="row">
      <button id="btnLive" title="Fetch monthly NASA POWER data (2005–2024) for every region">Fetch NASA POWER</button>
      <button class="ghost" id="btnImport">Import file</button>
      <button class="ghost" id="btnDemo">Demo</button>
    </div>
    <input type="file" id="fileNasa" accept=".json,application/json" class="hide">
    <div class="msg" id="dmsg">Loading embedded NASA POWER data…</div>
  </div>
</aside>
<div class="main">
  <header class="top">
    <button class="btn ghost menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <h1 id="title">Overview</h1>
    <span class="chip pilot" id="pilotChip">Pilot: Shortandy District, Akmola</span>
    <span class="sp"></span>
    <div class="periodsel" id="periodSel"></div>
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      <input id="q" type="text" placeholder="Find a region…" autocomplete="off" aria-label="Search regions">
      <ul id="qlist" role="listbox"></ul>
    </div>
  </header>
  <div id="banner"></div>
  <div id="views"></div>
</div>
</div>

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const PR_SHAPE = { // monthly share of annual precipitation
  north: [.05, .04, .045, .06, .09, .14, .16, .12, .08, .08, .07, .065],
  west: [.07, .06, .07, .08, .10, .10, .09, .07, .07, .09, .10, .10],

  mountain: [.04, .05, .09, .13, .14, .11, .09, .06, .06, .08, .08, .07]
};
const DEMO_YEARS = [2005, 2024];
function gauss(rnd) { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function makeDemo(region) {
  const rnd = mulberry32(hashStr(region.id));
  const d = region.demo, shape = PR_SHAPE[region.pr];
  const out = { source: "demo", label: "DEMO — synthetic values", years: {}, smapFrom: 2015, notes: "Synthetic series generated from an illustrative climate profile. Not NASA measurements." };
  for (let y = DEMO_YEARS[0]; y <= DEMO_YEARS[1]; y++) {
    const yearP = Math.max(0.45, 1 + 0.24 * gauss(rnd));        // year wetness factor
    const yearT = 0.9 * gauss(rnd) + 0.02 * (y - 2015);           // year temperature anomaly
    const months = [];
    for (let m = 1; m <= 12; m++) {
      const seas = (d.tl - d.tj) / 2, mid = (d.tl + d.tj) / 2;
      const t = mid - seas * Math.cos((m - 0.6) / 12 * 2 * Math.PI) + yearT + 1.1 * gauss(rnd);
      const p = Math.max(0, d.p * shape[m - 1] * yearP * (1 + 0.45 * gauss(rnd)));
      const spring = m >= 3 && m <= 5 ? 0.12 : 0, dry = m >= 7 && m <= 9 ? -0.10 * (t > 20 ? 1.3 : 1) : 0;
      const wr = Math.min(0.95, Math.max(0.08, d.w + spring + dry + 0.07 * (yearP - 1) + 0.025 * gauss(rnd)));
      const wt = Math.min(0.98, Math.max(0.05, wr + (p / 60 - 0.25) * 0.2 + 0.04 * gauss(rnd)));
      const tmax = t + 7.5 + 0.8 * gauss(rnd);
      const gs = m >= 5 && m <= 9;
      const ndvi = gs ? Math.max(0.08, (0.12 + 0.55 * wr) * Math.sin((m - 4) / 6 * Math.PI) * (0.85 + 0.15 * yearP) + 0.02 * gauss(rnd)) : (m === 4 || m === 10 ? 0.14 : null);
      const et = t > 0 ? Math.max(0, Math.min(p + 25 * wr, (t * 4.2) * (0.4 + wr))) : 1;
      months.push({ t, tmax, p, wr, wt, ndvi, et, smap: y >= 2015 && !(y === 2015 && m < 4) && t > 0 ? wt * 0.42 : null });
    }
    out.years[y] = months;

  if (ev.s.water < 0.7) cons.push(`Water needs covered only ${Math.round(ev.s.water * 100)}% on average; demand fully met in ${Math.round(ev.met_years * 100)}% of crop-years`);
  if (!legumes.length) cons.push("No legume: no biological N input, higher fertiliser need");
  if (seq.length === 1) cons.push("Monoculture: host-specific diseases, pests and weeds build up");
  return { pros, cons };
}

/* ---------------- Boundaries ---------------- */
const BOUNDARY = { status: "loading", source: null, byId: null, extra: [], missing: [], features: null };
const BOUNDARY_SOURCES = [
  { name: "amCharts 5 geodata (kazakhstanHigh, npm via jsDelivr)", url: "https://cdn.jsdelivr.net/npm/@amcharts/amcharts5-geodata@5/kazakhstanHigh.js" },
  { name: "amCharts 5 geodata (kazakhstanHigh, npm via unpkg)", url: "https://unpkg.com/@amcharts/amcharts5-geodata@5/kazakhstanHigh.js" },
  { name: "amCharts 4 geodata (kazakhstanHigh, npm via jsDelivr)", url: "https://cdn.jsdelivr.net/npm/@amcharts/amcharts4-geodata@4/kazakhstanHigh.js" }
];
function normName(s) {
  return String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[’'`ʼ]/g, "")
    .replace(/\b(oblysy|oblast|oblast'|region|province|obl\.?)\b/g, "").replace(/\s+/g, " ").trim();
}
function matchFeature(f) {
  const props = f.properties || {};
  const vals = Object.values(props).filter(v => typeof v === "string");
  const up = vals.map(v => v.toUpperCase().trim());
  for (const [id, al] of Object.entries(REGION_ALIASES)) for (const a of al) if (a.startsWith("KZ-") && up.includes(a)) return id;
  const names = vals.map(normName).join(" | ");
  const isCity = /\bcity\b|qalasy|\bg\.|\(city\)|shahary/i.test(vals.join(" ")) || /city/i.test(props.TYPE || props.type || props.ENGTYPE_1 || "");
  if (/shymkent|chimkent/.test(names)) return "shymkent";
  if (/almaty|alma-ata/.test(names)) {
    if (isCity) return "almaty";
    let area = 1; try { area = d3.geoArea(f); } catch (e) { }
    return area < 2e-5 ? "almaty" : "almaty_reg";
  }
  if (/astana|nur-sultan|nursultan/.test(names)) return "astana";
  const order = ["north_kz", "east_kz", "west_kz", "akmola", "kostanay", "pavlodar", "karaganda", "abai", "aktobe", "atyrau", "mangystau", "kyzylorda", "ulytau", "turkistan", "zhambyl", "zhetysu"];
  for (const id of order) for (const a of REGION_ALIASES[id]) if (!a.startsWith("KZ-") && names.includes(a)) return id;
  return null;
}
function rewind(fc) { // d3 needs clockwise outer rings; fix GeoJSON wound the RFC 7946 way
  for (const f of fc.features) {
    try { if (d3.geoArea(f) > 2 * Math.PI) { const g = f.geometry; const rv = rings => rings.map(r => r.slice().reverse()); if (g.type === "Polygon") g.coordinates = rv(g.coordinates); else if (g.type === "MultiPolygon") g.coordinates = g.coordinates.map(rv); } } catch (e) { }
  }
  return fc;
}
function useBoundaries(fc, sourceName) {
  if (fc && fc.type === "Topology") throw new Error("TopoJSON is not supported here; please use GeoJSON");
  if (!fc || !fc.features || !fc.features.length) throw new Error("no features");
  rewind(fc);
  const byId = {}, extra = [];
  for (const f of fc.features) {
    if (!f.geometry) continue;
    const id = matchFeature(f);
    if (!id) { extra.push(f); continue; }
    if (!byId[id]) byId[id] = { type: "Feature", properties: { id }, geometry: { type: "MultiPolygon", coordinates: [] } };
    const g = f.geometry; const tgt = byId[id].geometry.coordinates;
    if (g.type === "Polygon") tgt.push(g.coordinates); else if (g.type === "MultiPolygon") tgt.push(...g.coordinates);
  }
  if (Object.keys(byId).length < 8) throw new Error(`only ${Object.keys(byId).length} Kazakhstan regions recognised — is this an admin-1 file for Kazakhstan?`);
  Object.assign(BOUNDARY, { status: "ok", source: sourceName, byId, extra, missing: REGIONS.map(r => r.id).filter(id => !byId[id]) });
  return BOUNDARY;
}
async function loadBoundaries() {
  try { return useBoundaries(JSON.parse(JSON.stringify(EMBEDDED_BOUNDARIES)), "amCharts 5 geodata kazakhstanHigh (pre-2022 oblasts, embedded)"); } catch (e) { console.warn("[Qazaqstellar] embedded boundaries failed:", e && e.message); }
  for (const s of BOUNDARY_SOURCES) {
    try {
      const mod = await Promise.race([import(s.url), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))]);
      const fc = mod.default || mod;
      return useBoundaries(JSON.parse(JSON.stringify(fc)), s.name);
    } catch (e) { console.warn("[Qazaqstellar] boundary source failed:", s.name, e && e.message); }
  }
  Object.assign(BOUNDARY, { status: "none", source: null, byId: null, missing: REGIONS.map(r => r.id) });
  return BOUNDARY;
}

const KZ_BBOX = { type: "Feature", geometry: { type: "MultiPoint", coordinates: d3.range(46, 88.1, 2).flatMap(x => [[x, 40.5], [x, 55.6]]) } };
const LAYERS = {
  overall: { name: "Overall agricultural risk", kind: "risk" },
  drought: { name: "Drought risk", kind: "risk", key: "drought" },
  soil: { name: "Soil moisture (Jun–Aug GWETROOT)", kind: "value", unit: "0–1", get: a => a.I.jjaWr, scheme: d3.interpolateYlGnBu, fmt: v => v.toFixed(2) },
  temp: { name: "Temperature (May–Aug mean)", kind: "value", unit: "°C", get: a => a.I.gsT, scheme: d3.interpolateYlOrRd, fmt: v => v.toFixed(1) + " °C" },
  precip: { name: "Precipitation (annual)", kind: "value", unit: "mm", get: a => a.I.annP, scheme: d3.interpolateBlues, fmt: v => Math.round(v) + " mm" },
  veg: { name: "Vegetation health (peak NDVI)", kind: "value", unit: "NDVI", get: a => a.I.src.source === "demo" ? a.I.ndviPeak : null, scheme: d3.interpolateGreens, fmt: v => v.toFixed(2) }

function layerValue(id, layer) {
  const a = ANALYSIS[id], L = LAYERS[layer];
  if (!a) return null;
  if (L.kind === "risk") return L.key ? a.risks.find(r => r.key === L.key).score : a.overall;
  return L.get(a);
}
function layerColor(id, layer) {
  const v = layerValue(id, layer), L = LAYERS[layer];
  if (v == null) return "#3A4E61";
  if (L.kind === "risk") return levelOf(v).color;
  const vals = REGIONS.map(r => layerValue(r.id, layer)).filter(x => x != null);
  const [lo, hi] = d3.extent(vals);

}
function passesFilter(id) {
  if (!STATE.minLevel) return true;
  const v = layerValue(id, LAYERS[STATE.layer].kind === "risk" ? STATE.layer : "overall");

/* ---------------- search ---------------- */
function setupSearch() {
  const q = $("#q"), ul = $("#qlist"); let act = 0, items = [];
  const draw = () => {
    const t = normName(q.value);
    items = REGIONS.filter(r => !t || normName(r.name).includes(t) || normName(r.kk).includes(t) || r.capital.toLowerCase().includes(t) || (REGION_ALIASES[r.id] || []).some(a => normName(a).includes(t)));
    act = Math.min(act, Math.max(0, items.length - 1));
    ul.innerHTML = items.map((r, i) => `<li role="option" data-id="${r.id}" class="${i === act ? "act" : ""}"><span>${esc(r.name)}</span><small>${r.kind === "city" ? "city" : esc(r.capital)}</small></li>`).join("") || `<li class="muted">No match</li>`;
    ul.classList.add("open");
  };
  const pick = id => { ul.classList.remove("open"); q.value = ""; q.blur(); selectRegion(id); };
  q.addEventListener("input", () => { act = 0; draw(); });
  q.addEventListener("focus", draw);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { act = Math.min(items.length - 1, act + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { act = Math.max(0, act - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && items[act]) pick(items[act].id);
    else if (e.key === "Escape") ul.classList.remove("open");
  });
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li[data-id]"); if (li) pick(li.dataset.id); });
  q.addEventListener("blur", () => setTimeout(() => ul.classList.remove("open"), 150));
}

/* ---------------- VIEW: Rotation ---------------- */
function candidateRotations() {
  if (candidateRotations._c) return candidateRotations._c;
  const ANN = ["Wheat", "Barley", "Peas", "Lentils", "Sunflower"], set = new Map();
  const canon = s => { let b = null; for (let i = 0; i < s.length; i++) { const r = s.slice(i).concat(s.slice(0, i)); const k = r.join(","); if (b == null || k < b) b = k; } return b; };
  const rec = (cur, n) => { if (cur.length === n) { if (cur.every((c, i) => c !== cur[(i + 1) % n])) set.set(canon(cur), cur.slice()); return; } for (const c of ANN) { cur.push(c); rec(cur, n); cur.pop(); } };
  [3, 4, 5].forEach(n => rec([], n));
  for (const a of ANN) set.set("A3," + a, ["Alfalfa", "Alfalfa", "Alfalfa", a]);
  for (const a of ANN) for (const b of ANN) if (a !== b) set.set("A3," + a + "," + b, ["Alfalfa", "Alfalfa", "Alfalfa", a, b]);
  return candidateRotations._c = [...set.values()];
}

  }
  if (/missing|data|source|источник|данн/.test(ql)) {
    return `Data used for ${r.name}: ${demo ? "**DEMO synthetic values** (NASA POWER not loaded yet)" : `NASA POWER monthly data for ${I.years[0]}–${I.years[I.years.length - 1]} at ${I.src.lat}, ${I.src.lon}`}.\n- Soil moisture: GWETROOT is a model value at ≈50 km; SMAP (only from 2015) is not loaded.\n- Vegetation (MODIS MOD13) and evapotranspiration (MOD16): not loaded — vegetation stress is not assessed.\n- Soil texture, pH, organic matter, nutrients: need a laboratory analysis${STATE.profile.ph ? " (pH provided)" : ""}.\n- Field history: ${STATE.profile.prev1 ? "provided" : "not provided"}.\n${missing}`;
  }
  const top = a.risks.filter(x => x.score != null && x.key !== "suitability").sort((x, y) => y.score - x.score).slice(0, 3);
  const tol = CROP_IDS.map(c => [c, a.comp[c + "|none"]]).sort((x, y) => (y[1].water * 0.55 + y[1].drought * 0.45) - (x[1].water * 0.55 + x[1].drought * 0.45)).slice(0, 2).map(x => x[0]);
  return `${demoNote}${r.name} shows **${a.overallLevel.name.toLowerCase()} overall agricultural risk** (${a.overall.toFixed(2)}) over ${I.years[0]}–${I.years[I.years.length - 1]}.\n${top.map(x => `- **${x.name}: ${x.level.name}** — ${x.evidence[0]}`).join("\n")}\nIn ${I.dryYears.length} of ${I.n} seasons May–August rainfall was below 75% of the median. Drought resilience is worth considering when choosing crops; ${tol.join(" and ")} may be worth evaluating as part of a diversified rotation.${demo ? "" : " Vegetation stress is not assessed because MODIS NDVI is not loaded."} These findings are based on historical observations and are not a forecast of future weather.\n${srcLine}\n${missing}`;
}
function renderInsight(el) {
  const ai = STATE.ai;
  el.innerHTML = `<h2><span class="dot"></span> Qazaqstellar AI — regional insight</h2><p class="sub">${ai ? "Claude-powered interpretation, grounded on this page's indicators." : "Rule-based summary of the indicators on this page."}</p><div id="insTxt">${mdLite(ruleAnswer("summary"))}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${ai ? '<button class="btn" id="insAI">Ask Qazaqstellar AI for a full analysis</button>' : ""}<button class="btn ghost" style="color:#E6EEF5;border-color:#2C4C68" id="insChat">Open AI assistant</button></div>`;
  const b = el.querySelector("#insAI"); if (b) b.onclick = () => { go("ai"); setTimeout(() => askAI(`Give me an overall agricultural risk analysis for ${REGION_BY_ID[STATE.region].name}.`), 50); };
  el.querySelector("#insChat").onclick = () => go("ai");
}

/* ---------------- VIEW: Field ---------------- */
function vField(el) {
  const p = STATE.profile;
  const opt = (list, v) => list.map(([k, n]) => `<option value="${k}" ${k === v ? "selected" : ""}>${n}</option>`).join("");
  const cropOpts = [["", "Unknown"], ...CROP_IDS.map(c => [c, c]), ["Fallow", "Fallow"]];
  el.innerHTML = `
  <div class="sec-h"><h2>Farmer profile & field analysis</h2><p>Optional. Field information turns regional estimates into field-adjusted estimates. Without it, every result is labelled as a <b>regional estimate</b>. Stored only in this browser.</p></div>
  <form class="card" id="pf">
    <h2>Field</h2>
    <div class="form">
      <label>Field name<input name="name" type="text" value="${esc(p.name || "")}" placeholder="e.g. North field"></label>
      <label>Latitude (° N)<input name="lat" type="number" step="0.001" value="${esc(p.lat || "")}" placeholder="51.700"></label>
      <label>Longitude (° E)<input name="lon" type="number" step="0.001" value="${esc(p.lon || "")}" placeholder="71.000"></label>
      <label>Field size (ha)<input name="ha" type="number" value="${esc(p.ha || "")}" placeholder="150"></label>
      <label>Soil type<select name="soilType">${opt(Object.entries(SOIL_LABELS), p.soilType || "unknown")}</select></label>
      <label>Irrigation<select name="irrigation">${opt([["none", "None (rain-fed)"], ["partial", "Partial / supplementary"], ["full", "Full irrigation"]], p.irrigation || "none")}</select></label>
      <label>Previous crop (last season)<select name="prev1">${opt(cropOpts, p.prev1 || "")}</select></label>
      <label>Crop two seasons ago<select name="prev2">${opt(cropOpts, p.prev2 || "")}</select></label>
    </div>
    <h2 style="margin-top:16px">Soil analysis (laboratory results, if available)</h2>
    <div class="form">
      <label>pH<input name="ph" type="number" step="0.1" value="${esc(p.ph || "")}"></label>
      <label>Organic matter (%)<input name="om" type="number" step="0.1" value="${esc(p.om || "")}"></label>
      <label>Nitrate-N (mg/kg)<input name="n" type="number" value="${esc(p.n || "")}"></label>
      <label>Phosphorus P (mg/kg)<input name="p" type="number" value="${esc(p.p || "")}"></label>
      <label>Potassium K (mg/kg)<input name="k" type="number" value="${esc(p.k || "")}"></label>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn">Save and apply</button>
      <button class="btn ghost" type="button" id="pPilot">Fill Shortandy pilot</button>
      <button class="btn ghost" type="button" id="pPower">Fetch NASA POWER for this point</button>
      <button class="btn ghost" type="button" id="pClear">Clear profile</button>
    </div>
    <p class="note">Irrigation adds 100 mm (partial) or 250 mm (full) to modelled water supply. Soil type sets root-zone storage (chernozem 200 mm … light soil 110 mm). The previous crop is used for the first-year transition in rotation cards. pH is checked against each crop's indicative range.</p>
  </form>
  <div class="card" style="margin-top:16px"><h2>How your inputs are used</h2>
    <table><thead><tr><th>Input</th><th>Status</th><th>Effect</th></tr></thead><tbody>
    <tr><td>Location</td><td>${p.lat ? statusChip("farmer") : statusChip("unavailable")}</td><td>${p.lat ? `Inside ${esc(REGION_BY_ID[nearestRegion(+p.lat, +p.lon)].name)}; NASA POWER can be fetched for this exact point` : "Region reference point used"}</td></tr>
    <tr><td>Soil type</td><td>${p.soilType && p.soilType !== "unknown" ? statusChip("farmer") : statusChip("external")}</td><td>Storage ${SOIL_STORAGE[p.soilType || "unknown"]} mm in Water Efficiency</td></tr>
    <tr><td>Irrigation</td><td>${statusChip(p.irrigation && p.irrigation !== "none" ? "farmer" : "external")}</td><td>${IRRIGATION_MM[p.irrigation || "none"]} mm added to supply</td></tr>
    <tr><td>Previous crops</td><td>${p.prev1 ? statusChip("farmer") : statusChip("unavailable")}</td><td>${p.prev1 ? `Transition check from ${esc(p.prev1)}` : "Rotation assumed in steady state"}</td></tr>
    <tr><td>Soil analysis</td><td>${p.ph || p.om ? statusChip("farmer") : statusChip("unavailable")}</td><td>${p.ph ? phCheck(+p.ph) : "Fertility indicators shown as not available"}</td></tr>
    </tbody></table></div>`;
  $("#pf").onsubmit = e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    for (const k in fd) if (fd[k] === "") delete fd[k];

    if (fd.lat && fd.lon) { const id = nearestRegion(+fd.lat, +fd.lon); if (id && id !== STATE.region) { STATE.region = id; toast(`Field is in ${REGION_BY_ID[id].name} — region switched.`); } }

  };
  $("#pPilot").onclick = () => { STATE.profile = { name: "Shortandy pilot field", lat: "51.7", lon: "71.0", ha: "150", soilType: "chernozem", irrigation: "none", prev1: "Wheat" }; try { localStorage.setItem("qz_profile", JSON.stringify(STATE.profile)); } catch (e) { } STATE.region = "akmola"; recompute(); render(); toast("Pilot field filled from the FIELD SHIFT report §8.2 (rain-fed chernozem; previous crop assumed wheat)."); };

    try { STORE.series[id] = await fetchPower(lat, lon); cacheSet("qz_power_" + id, STORE.series[id]); STATE.region = id; recompute(); render(); toast("NASA POWER loaded for your field point."); }
    catch (e) { toast(liveErrorText(e), 9000); }
  };
}

/* ---------------- data controls ---------------- */
function liveErrorText(e) {
  return (e && e.name === "TypeError") || /fetch|network|load|abort/i.test(e && e.message || "")
    ? "NASA POWER could not be reached from here. Inside claude.ai the page is sandboxed; open the downloaded HTML file in a browser with internet, or use Import file."
    : "NASA POWER error: " + (e && e.message);
}
async function fetchAll() {
  const btn = $("#btnLive"); btn.disabled = true;
  const ids = REGIONS.map(r => r.id); let done = 0, fail = null;
  for (let i = 0; i < ids.length && !fail; i += 3) {
    await Promise.all(ids.slice(i, i + 3).map(async id => {
      const r = REGION_BY_ID[id];
      try { STORE.series[id] = await fetchPower(r.ref.lat, r.ref.lon); cacheSet("qz_power_" + id, STORE.series[id]); done++; $("#dmsg").textContent = `NASA POWER: ${done}/20 regions loaded…`; }
      catch (e) { fail = fail || e; }
    }));
  }
  btn.disabled = false;
  if (fail && !done) { $("#dmsg").textContent = "Live request failed — still in demo mode."; toast(liveErrorText(fail), 10000); return; }
  $("#dmsg").textContent = `NASA POWER loaded for ${done}/20 regions (${POWER_YEARS.join("–")}).${fail ? " Some requests failed." : ""}`;
  recompute(); render();
}
function setupData() {
  $("#btnLive").onclick = fetchAll;
  $("#btnImport").onclick = () => $("#fileNasa").click();
  $("#fileNasa").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const ids = importNasaJson(JSON.parse(await f.text()), STATE.region); recompute(); render(); $("#dmsg").textContent = `Imported NASA POWER for ${ids.length} region(s) from ${f.name}.`; toast(`Imported NASA POWER data for ${ids.map(i => REGION_BY_ID[i].name).join(", ")}.`); }
    catch (er) { toast("Import failed: " + er.message, 9000); }
    e.target.value = "";
  };
  $("#btnDemo").onclick = () => { STORE.series = {}; for (const r of REGIONS) STORE.series[r.id] = makeDemo(r); try { REGIONS.forEach(r => localStorage.removeItem("qz_power_" + r.id)); } catch (e) { } recompute(); render(); $("#dmsg").textContent = "Back to synthetic demo values."; };
  // cached live data from an earlier visit
  for (const r of REGIONS) { const c = cacheGet("qz_power_" + r.id); if (c && c.source === "power" && c.years) STORE.series[r.id] = c; }
  if (!Object.keys(STORE.series).length) { try { const ids = importNasaJson(EMBEDDED_POWER); STORE.series[ids[0]]; $("#dmsg").textContent = `Real NASA POWER monthly data, 2005–2024, embedded for ${ids.length}/20 points (retrieved ${EMBEDDED_POWER.fetched}). “Fetch NASA POWER” refreshes it online.`; } catch (e) { console.warn("[Qazaqstellar] embedded data failed:", e && e.message); } }
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
}

/* ---------------- boot ---------------- */
function boot() {
  buildNav(); setupSearch(); setupData();
  recompute();
  window.addEventListener("hashchange", route);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 200); });
  route();
  loadBoundaries().then(() => { render(); if (BOUNDARY.status !== "ok") toast("Boundary file not reachable — regions shown as points. You can load a GeoJSON in About."); });
  aiInit();
}
document.addEventListener("DOMContentLoaded", boot);

</script>
